<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Portfolio</title>
<meta name="description" content="비공개 페이지입니다.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6; --blue:#0071e3;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:grid;place-items:center;padding:28px;
  background:
    radial-gradient(62% 46% at 10% -8%,rgba(0,113,227,.08),rgba(0,113,227,0) 58%),
    radial-gradient(56% 44% at 92% 2%,rgba(168,184,210,.26),rgba(168,184,210,0) 62%),
    radial-gradient(90% 64% at 50% 106%,rgba(213,223,238,.55),rgba(213,223,238,0) 72%),
    linear-gradient(180deg,#ffffff 0%,#fdfdfe 34%,#f7f8fa 68%,#f3f4f6 100%);
  color:var(--ink);font-family:var(--font);letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
.gate{width:100%;max-width:392px;text-align:center}
.gate__card{
  position:relative;overflow:hidden;
  padding:38px 30px 30px;border-radius:28px;
  border:1px solid rgba(255,255,255,.95);
  background:linear-gradient(157deg,rgba(255,255,255,.88),rgba(255,255,255,.52));
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -22px 44px -34px rgba(120,140,175,.55),
    0 0 0 1px rgba(23,34,55,.045),
    0 2px 4px rgba(23,34,55,.04),
    0 26px 60px -30px rgba(23,34,55,.3);
}
.gate__card::before{
  content:"";position:absolute;left:-20%;top:-60%;width:140%;height:120%;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
  pointer-events:none;
}
.gate__mark{
  position:relative;width:46px;height:46px;margin:0 auto 22px;display:grid;place-items:center;
  border-radius:50%;border:1px solid rgba(255,255,255,.95);
  background:linear-gradient(158deg,rgba(255,255,255,.98),rgba(243,245,248,.86));
  box-shadow:inset 0 1px 0 #fff,inset 0 -8px 14px -10px rgba(120,140,175,.6),0 0 0 1px rgba(23,34,55,.05),0 6px 14px -10px rgba(23,34,55,.4);
}
.gate__mark svg{width:19px;height:19px;stroke:#1d1d1f;opacity:.82}
h1{position:relative;margin:0;font-size:1.3rem;font-weight:600;letter-spacing:-.035em;color:var(--ink)}
.gate__sub{position:relative;margin:9px 0 26px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
form{position:relative;display:flex;flex-direction:column;gap:10px;margin:0}
input{
  width:100%;height:48px;padding:0 16px;border-radius:14px;
  border:1px solid rgba(23,34,55,.1);
  background:rgba(255,255,255,.92);
  color:var(--ink);font:inherit;font-size:15px;letter-spacing:.06em;
  box-shadow:inset 0 1px 2px rgba(23,34,55,.05);
  transition:border-color .25s,box-shadow .25s,background .25s;
}
input::placeholder{color:var(--ink-3);letter-spacing:-.011em}
input:focus{outline:none;border-color:rgba(0,113,227,.55);background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.14)}
button{
  height:48px;border:0;border-radius:14px;cursor:pointer;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-.015em;
  color:#fff;background:linear-gradient(180deg,#0a7cf2,#0071e3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 22px -14px rgba(0,86,171,.9);
  transition:background .25s,transform .25s,opacity .25s;
}
button:hover{background:linear-gradient(180deg,#1a86f5,#0077ed)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default;transform:none}
.gate__error{position:relative;margin:12px 0 0;font-size:13px;color:#d70015;min-height:18px}
.gate__foot{margin:26px 0 0;font-size:11.5px;color:var(--ink-3);letter-spacing:.01em}
noscript{display:block;margin-top:18px;font-size:13px;color:var(--ink-2)}
@media (max-width:420px){
  body{padding:18px}
  .gate__card{padding:32px 22px 24px;border-radius:24px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms}}
</style>
</head>
<body>
<main class="gate">
  <div class="gate__card">
    <div class="gate__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.6"></rect>
        <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"></path>
      </svg>
    </div>
    <h1>비공개 포트폴리오</h1>
    <p class="gate__sub">비밀번호를 입력하면 열립니다.</p>
    <form id="gateForm" autocomplete="off">
      <label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">비밀번호</label>
      <input id="pw" name="pw" type="password" inputmode="text" spellcheck="false"
             autocomplete="current-password" placeholder="비밀번호" required>
      <button type="submit" id="gateBtn">열기</button>
    </form>
    <p class="gate__error" id="gateError" role="alert"></p>
  </div>
  <p class="gate__foot">이 페이지의 내용은 암호화되어 있습니다.</p>
  <noscript>이 페이지를 열려면 JavaScript가 필요합니다.</noscript>
</main>

<script>
(function () {
  "use strict";
  var meta = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gateForm");
  var input = document.getElementById("pw");
  var button = document.getElementById("gateBtn");
  var error = document.getElementById("gateError");

  function fromB64(text) {
    var raw = atob(text);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function toB64(bytes) {
    var text = "";
    for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
    return btoa(text);
  }

  /* 비밀번호 → 32바이트 키 (PBKDF2-HMAC-SHA256) */
  async function deriveKeyBytes(password) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
    );
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: fromB64(meta.salt), iterations: meta.iterations, hash: "SHA-256" },
      baseKey,
      256
    );
    return new Uint8Array(bits);
  }

  async function decryptWithKey(keyBytes) {
    var key = await crypto.subtle.importKey(
      "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: fromB64(meta.iv), tagLength: 128 },
      key,
      fromB64(meta.data)
    );
    return new TextDecoder().decode(plain);
  }

  var swapped = false;

  function show(html) {
    /* 문서 로딩이 끝난 뒤에 바꿔야 이전 화면이 남지 않는다 */
    var swap = function () {
      if (swapped) return;
      swapped = true;
      document.open();
      document.write(html);
      document.close();
    };
    var poll = function () {
      if (document.readyState === "complete") swap();
      else setTimeout(poll, 60);
    };
    poll();
  }

  function fail(message) {
    error.textContent = message;
    button.disabled = false;
    input.disabled = false;
    input.select();
    input.focus();
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!window.crypto || !window.crypto.subtle) {
      fail("이 브라우저에서는 열 수 없습니다. https 주소로 접속해 주세요.");
      return;
    }
    var password = input.value;
    if (!password) return;

    error.textContent = "";
    button.disabled = true;
    button.textContent = "여는 중";
    input.disabled = true;

    var started = Date.now();
    var html;
    var keyBytes;
    try {
      keyBytes = await deriveKeyBytes(password);
      html = await decryptWithKey(keyBytes);
    } catch (err) {
      var spent = Date.now() - started;
      if (spent < 400) await wait(400 - spent);
      button.textContent = "열기";
      fail("비밀번호가 맞지 않습니다.");
      return;
    }

    /* 새로고침해도 이 탭에서는 다시 묻지 않도록 키만 남긴다 (비밀번호는 저장하지 않음) */
    try { sessionStorage.setItem("portfolio-unlocked", toB64(keyBytes)); } catch (err) {}

    show(html);
  });

  /* 이 탭에서 이미 열었다면 저장된 키로 바로 연다 */
  (async function resume() {
    var stored = null;
    try { stored = sessionStorage.getItem("portfolio-unlocked"); } catch (err) {}
    if (!stored) return;
    try {
      show(await decryptWithKey(fromB64(stored)));
    } catch (err) {
      try { sessionStorage.removeItem("portfolio-unlocked"); } catch (e) {}
    }
  })();})();
</script>
</body>
</html>
