<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Portfolio</title>
<meta name="description" content="비공개 페이지입니다.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#f2f3f5; --ink-2:rgba(242,243,245,.62); --ink-3:rgba(242,243,245,.36);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:grid;place-items:center;padding:28px;
  background:
    radial-gradient(86% 50% at 50% -8%,rgba(158,178,220,.15),rgba(158,178,220,0) 62%),
    linear-gradient(180deg,#0d0d10 0%,#07070a 40%,#000 100%);
  color:var(--ink);font-family:var(--font);letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
.gate{width:100%;max-width:376px;text-align:center}
.gate__mark{
  width:44px;height:44px;margin:0 auto 26px;display:grid;place-items:center;
  border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(168deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
}
.gate__mark svg{width:19px;height:19px;stroke:rgba(242,243,245,.72)}
h1{margin:0;font-size:1.32rem;font-weight:600;letter-spacing:-.035em}
.gate__sub{margin:10px 0 30px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
form{display:flex;flex-direction:column;gap:10px;margin:0}
input{
  width:100%;height:48px;padding:0 16px;border-radius:13px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
  color:var(--ink);font:inherit;font-size:15px;letter-spacing:.06em;
  transition:border-color .25s,background .25s;
}
input::placeholder{color:var(--ink-3);letter-spacing:-.011em}
input:focus{outline:none;border-color:rgba(183,203,255,.45);background:rgba(255,255,255,.07)}
button{
  height:48px;border:0;border-radius:13px;cursor:pointer;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-.015em;
  color:#08080a;background:#f2f3f5;transition:background .25s,opacity .25s;
}
button:hover{background:#fff}
button:disabled{opacity:.5;cursor:default}
.gate__error{margin:14px 0 0;font-size:13px;color:#ff8f8f;min-height:18px}
.gate__foot{margin:34px 0 0;font-size:11.5px;color:var(--ink-3);letter-spacing:.01em}
noscript{display:block;margin-top:18px;font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms}}
</style>
</head>
<body>
<main class="gate">
  <div class="gate__mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="2.6"></rect>
      <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7"></path>
    </svg>
  </div>
  <h1>비공개 포트폴리오</h1>
  <p class="gate__sub">비밀번호를 입력하면 열립니다.</p>
  <form id="gateForm" autocomplete="off">
    <label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">비밀번호</label>
    <input id="pw" name="pw" type="password" inputmode="text" spellcheck="false"
           autocomplete="current-password" placeholder="비밀번호" required>
    <button type="submit" id="gateBtn">열기</button>
  </form>
  <p class="gate__error" id="gateError" role="alert"></p>
  <p class="gate__foot">이 페이지의 내용은 암호화되어 있습니다.</p>
  <noscript>이 페이지를 열려면 JavaScript가 필요합니다.</noscript>
</main>

<script>
(function () {
  "use strict";
  var meta = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gateForm");
  var input = document.getElementById("pw");
  var button = document.getElementById("gateBtn");
  var error = document.getElementById("gateError");

  function fromB64(text) {
    var raw = atob(text);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function toB64(bytes) {
    var text = "";
    for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
    return btoa(text);
  }

  /* 비밀번호 → 32바이트 키 (PBKDF2-HMAC-SHA256) */
  async function deriveKeyBytes(password) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
    );
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: fromB64(meta.salt), iterations: meta.iterations, hash: "SHA-256" },
      baseKey,
      256
    );
    return new Uint8Array(bits);
  }

  async function decryptWithKey(keyBytes) {
    var key = await crypto.subtle.importKey(
      "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: fromB64(meta.iv), tagLength: 128 },
      key,
      fromB64(meta.data)
    );
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function fail(message) {
    error.textContent = message;
    button.disabled = false;
    input.disabled = false;
    input.select();
    input.focus();
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!window.crypto || !window.crypto.subtle) {
      fail("이 브라우저에서는 열 수 없습니다. https 주소로 접속해 주세요.");
      return;
    }
    var password = input.value;
    if (!password) return;

    error.textContent = "";
    button.disabled = true;
    button.textContent = "여는 중";
    input.disabled = true;

    var started = Date.now();
    var html;
    var keyBytes;
    try {
      keyBytes = await deriveKeyBytes(password);
      html = await decryptWithKey(keyBytes);
    } catch (err) {
      var spent = Date.now() - started;
      if (spent < 400) await wait(400 - spent);
      button.textContent = "열기";
      fail("비밀번호가 맞지 않습니다.");
      return;
    }

    /* 새로고침해도 이 탭에서는 다시 묻지 않도록 키만 남긴다 (비밀번호는 저장하지 않음) */
    try { sessionStorage.setItem("portfolio-unlocked", toB64(keyBytes)); } catch (err) {}

    show(html);
  });

  /* 이 탭에서 이미 열었다면 저장된 키로 바로 연다 */
  (async function resume() {
    var stored = null;
    try { stored = sessionStorage.getItem("portfolio-unlocked"); } catch (err) {}
    if (!stored) return;
    try {
      show(await decryptWithKey(fromB64(stored)));
    } catch (err) {
      try { sessionStorage.removeItem("portfolio-unlocked"); } catch (e) {}
    }
  })();
})();
</script>
