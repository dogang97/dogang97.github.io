<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private Portfolio</title>
<meta name="description" content="비공개 페이지입니다.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --ink:#101216; --ink-2:#4d515a; --ink-3:#8b909a; --line:rgba(16,22,38,.09); --line-2:rgba(16,22,38,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-en:"Inter","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;display:grid;place-items:center;padding:28px;min-height:100svh;
  background:
    radial-gradient(44% 34% at 6% -10%,rgba(126,174,255,.12),rgba(126,174,255,0) 64%),
    radial-gradient(38% 30% at 96% -6%,rgba(150,176,214,.2),rgba(150,176,214,0) 68%),
    radial-gradient(90% 38% at 50% 108%,rgba(184,204,234,.34),rgba(184,204,234,0) 78%),
    linear-gradient(178deg,#ffffff 0%,#fdfdff 30%,#f7f9fd 64%,#f1f4f9 100%);
  color:var(--ink);font-family:var(--font);letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.045;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.6'/></svg>");
  background-size:160px 160px;
}
.glow{position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
.glow--a{width:460px;height:460px;left:4%;top:2%;background:radial-gradient(circle,rgba(126,174,255,.22),rgba(126,174,255,0) 70%)}
.glow--b{width:520px;height:520px;right:0;bottom:-6%;background:radial-gradient(circle,rgba(160,186,220,.34),rgba(160,186,220,0) 70%)}
@media (max-width:640px){
  .glow--a{width:300px;height:300px;left:-16%;top:-4%}
  .glow--b{width:360px;height:360px;right:-24%;bottom:-8%}
}
.gate{position:relative;z-index:1;width:100%;max-width:396px;text-align:left}
.gate__card{
  position:relative;overflow:hidden;isolation:isolate;
  padding:28px 28px 26px;border-radius:28px;
  background:linear-gradient(158deg,rgba(255,255,255,.86),rgba(250,252,255,.56) 56%,rgba(244,249,255,.44));
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(255,255,255,.75),
    inset 0 -26px 46px -38px rgba(104,134,180,.6),
    0 1px 1px rgba(16,24,40,.04),
    0 10px 24px -18px rgba(16,24,40,.3),
    0 34px 64px -46px rgba(16,24,40,.38);
}
.gate__card::before{
  content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;
  background:linear-gradient(148deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.4) 30%,rgba(150,180,222,.55) 58%,rgba(255,255,255,.92) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  pointer-events:none;opacity:.85;
}
.gate__prism{
  position:absolute;top:0;left:10%;right:10%;height:1.5px;z-index:3;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(178,205,255,.9) 18%,rgba(206,196,255,.85) 42%,rgba(255,214,235,.8) 62%,rgba(196,238,255,.85) 82%,rgba(255,255,255,0));
  opacity:.85;pointer-events:none;
}
.gate__aura{
  position:absolute;left:-20%;right:-20%;bottom:-46%;height:96%;z-index:0;border-radius:50%;
  background:conic-gradient(from 150deg at 50% 50%,rgba(132,190,246,.26),rgba(160,176,240,.22) 84deg,rgba(206,200,244,.18) 160deg,rgba(255,255,255,0) 250deg);
  filter:blur(42px);opacity:.9;pointer-events:none;
}
.gate__head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.gate__mark{
  display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(158deg,rgba(255,255,255,.99),rgba(243,245,249,.9));
  box-shadow:inset 0 1px 0 #fff,inset 0 -8px 14px -10px rgba(122,146,182,.65),0 0 0 1px rgba(16,24,40,.06),0 4px 10px -7px rgba(16,24,40,.3);
}
.gate__mark svg{width:15px;height:15px;stroke:#101216;opacity:.66}
.gate__eyebrow{
  font-family:var(--font-en);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#8b909a;
}
h1{position:relative;margin:0;font-size:1.32rem;font-weight:600;letter-spacing:-.042em;line-height:1.32;color:var(--ink)}
.gate__sub{position:relative;margin:8px 0 22px;font-size:13px;line-height:1.6;color:var(--ink-2)}
form{position:relative;display:flex;flex-direction:column;gap:8px;margin:0}
input{
  width:100%;height:46px;padding:0 15px;border-radius:13px;
  border:1px solid rgba(16,22,38,.11);
  background:rgba(255,255,255,.92);
  color:var(--ink);font:inherit;font-size:14.5px;letter-spacing:.05em;
  box-shadow:inset 0 1px 2px rgba(16,22,38,.05);
  transition:border-color .25s,box-shadow .25s,background .25s;
}
input::placeholder{color:#a0a5af;letter-spacing:-.012em}
input:focus{outline:none;border-color:rgba(16,22,38,.34);background:#fff;box-shadow:0 0 0 4px rgba(16,22,38,.06)}
button{
  height:46px;border:0;border-radius:13px;cursor:pointer;
  font:inherit;font-size:14px;font-weight:500;letter-spacing:-.015em;color:#fff;
  background:linear-gradient(172deg,#33353b,#131418 58%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px -12px rgba(16,24,40,.62);
  transition:background .25s,transform .2s,opacity .25s;
}
button:hover{background:linear-gradient(172deg,#40434a,#191a1f 58%)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default;transform:none}
.gate__error{position:relative;margin:10px 0 0;font-size:12.4px;color:#c8271f;min-height:16px}
.gate__foot{
  margin:18px 0 0;text-align:center;font-family:var(--font-en);
  font-size:10.8px;letter-spacing:.06em;text-transform:uppercase;color:#a0a5af;
}
noscript{display:block;margin-top:14px;text-align:center;font-size:12.5px;color:var(--ink-2)}
@media (max-width:420px){
  body{padding:18px}
  .gate__card{padding:24px 20px 22px;border-radius:24px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms}}
</style>
</head>
<body>
<span class="grain" aria-hidden="true"></span>
<span class="glow glow--a" aria-hidden="true"></span>
<span class="glow glow--b" aria-hidden="true"></span>
<main class="gate">
  <div class="gate__card">
    <span class="gate__prism" aria-hidden="true"></span>
    <span class="gate__aura" aria-hidden="true"></span>
    <div class="gate__head">
      <span class="gate__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.8" y="10.4" width="14.4" height="9.8" rx="2.6"></rect>
          <path d="M8.4 10.4V7.9a3.6 3.6 0 0 1 7.2 0v2.5"></path>
        </svg>
      </span>
      <span class="gate__eyebrow">Private</span>
    </div>
    <h1>비공개 포트폴리오</h1>
    <p class="gate__sub">비밀번호를 입력하면 열립니다.</p>
    <form id="gateForm" autocomplete="off">
      <label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">비밀번호</label>
      <input id="pw" name="pw" type="password" inputmode="text" spellcheck="false"
             autocomplete="current-password" placeholder="비밀번호" required>
      <button type="submit" id="gateBtn">열기</button>
    </form>
    <p class="gate__error" id="gateError" role="alert"></p>
  </div>
  <p class="gate__foot">Encrypted · AES-256-GCM</p>
  <noscript>이 페이지를 열려면 JavaScript가 필요합니다.</noscript>
</main>

<script>
(function () {
  "use strict";
  var meta = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gateForm");
  var input = document.getElementById("pw");
  var button = document.getElementById("gateBtn");
  var error = document.getElementById("gateError");

  function fromB64(text) {
    var raw = atob(text);
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function toB64(bytes) {
    var text = "";
    for (var i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
    return btoa(text);
  }

  /* 비밀번호 → 32바이트 키 (PBKDF2-HMAC-SHA256) */
  async function deriveKeyBytes(password) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
    );
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: fromB64(meta.salt), iterations: meta.iterations, hash: "SHA-256" },
      baseKey,
      256
    );
    return new Uint8Array(bits);
  }

  async function decryptWithKey(keyBytes) {
    var key = await crypto.subtle.importKey(
      "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: fromB64(meta.iv), tagLength: 128 },
      key,
      fromB64(meta.data)
    );
    return new TextDecoder().decode(plain);
  }

  var swapped = false;

  function show(html) {
    /* 문서 로딩이 끝난 뒤에 바꿔야 이전 화면이 남지 않는다 */
    var swap = function () {
      if (swapped) return;
      swapped = true;
      document.open();
      document.write(html);
      document.close();
    };
    var poll = function () {
      if (document.readyState === "complete") swap();
      else setTimeout(poll, 60);
    };
    poll();
  }

  function fail(message) {
    error.textContent = message;
    button.disabled = false;
    input.disabled = false;
    input.select();
    input.focus();
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!window.crypto || !window.crypto.subtle) {
      fail("이 브라우저에서는 열 수 없습니다. https 주소로 접속해 주세요.");
      return;
    }
    var password = input.value;
    if (!password) return;

    error.textContent = "";
    button.disabled = true;
    button.textContent = "여는 중";
    input.disabled = true;

    var started = Date.now();
    var html;
    var keyBytes;
    try {
      keyBytes = await deriveKeyBytes(password);
      html = await decryptWithKey(keyBytes);
    } catch (err) {
      var spent = Date.now() - started;
      if (spent < 400) await wait(400 - spent);
      button.textContent = "열기";
      fail("비밀번호가 맞지 않습니다.");
      return;
    }

    /* 새로고침해도 이 탭에서는 다시 묻지 않도록 키만 남긴다 (비밀번호는 저장하지 않음) */
    try { sessionStorage.setItem("portfolio-unlocked", toB64(keyBytes)); } catch (err) {}

    show(html);
  });

  /* 이 탭에서 이미 열었다면 저장된 키로 바로 연다 */
  (async function resume() {
    var stored = null;
    try { stored = sessionStorage.getItem("portfolio-unlocked"); } catch (err) {}
    if (!stored) return;
    try {
      show(await decryptWithKey(fromB64(stored)));
    } catch (err) {
      try { sessionStorage.removeItem("portfolio-unlocked"); } catch (e) {}
    }
  })();})();
</script>
</body>
</html>
