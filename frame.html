<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px 확인용</title>
<style>
  html, body { margin: 0; background: #111; font: 13px/1 -apple-system, system-ui, sans-serif; color: #aaa; }
  body { display: flex; gap: 16px; align-items: flex-start; justify-content: center; padding: 12px 0; }
  nav { position: sticky; top: 0; display: flex; flex-direction: column; gap: 6px; width: 92px; }
  button { font: inherit; padding: 6px 8px; border: 1px solid #333; background: #1b1b1b; color: #ccc; border-radius: 6px; cursor: pointer; }
  iframe { width: 390px; height: 844px; border: 1px solid #333; background: #000; }
</style>
</head>
<body>
<nav>
  <button data-y="0">맨 위</button>
  <button data-y="700">소개</button>
  <button data-y="1500">경력</button>
  <button data-y="3200">역량</button>
  <button data-y="3900">프로젝트</button>
  <button data-y="5400">학력</button>
  <button data-y="6400">연락처</button>
</nav>
<iframe id="f" src="/" title="미리보기"></iframe>
<script>
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      var y = parseInt(b.dataset.y, 10);
      document.getElementById("f").contentWindow.scrollTo(0, y);
    });
  });
</script>
</body>
</html>
